name: classtrack
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.3
  google_fonts: ^8.0.2
  percent_indicator: ^4.2.5
  mobile_scanner: ^7.2.0
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo_mark.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
