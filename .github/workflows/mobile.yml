name: Mobile CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'classtrack/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'classtrack/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classtrack

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
